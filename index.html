<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Trainer</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <main class="container">
        <section id="welcome-screen" class="screen active">
            <div class="welcome-content">
                <h1>Quiz Trainer</h1>
                <p>¿Listo para el siguiente quiz?</p>
                <button id="start-button" class="btn btn-primary">Comenzar</button>
            </div>
        </section>

        <section id="question-screen" class="screen">
            <div class="progress-bar">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="question-counter">
                <span id="current-question">1</span> de <span id="total-questions">0</span>
            </div>
            <div class="session-stats">
                <div class="stat-item stat-correct">
                    <span class="stat-label">Correctas:</span>
                    <span id="correct-count" class="stat-value">0</span>
                </div>
                <div class="stat-item stat-incorrect">
                    <span class="stat-label">Incorrectas:</span>
                    <span id="incorrect-count" class="stat-value">0</span>
                </div>
                <div class="stat-item stat-progress">
                    <span class="stat-label">Progreso:</span>
                    <span id="progress-percentage" class="stat-value">0%</span>
                </div>
            </div>
            <div class="question-container">
                <div id="question-image" class="question-image"></div>
                <h2 id="question-statement" class="question-statement"></h2>
                <div id="options-container" class="options-container"></div>
                <div id="feedback-message" class="feedback-message" style="display: none;"></div>
                <div class="action-buttons">
                    <button id="answer-button" class="btn btn-primary" disabled>Responder</button>
                    <button id="next-button" class="btn btn-primary" style="display: none;">Siguiente</button>
                </div>
            </div>
        </section>

        <section id="results-screen" class="screen">
            <div class="results-content">
                <h2>Sesión Completada</h2>
                <p>Has respondido todas las preguntas.</p>
                <button id="restart-button" class="btn btn-primary">Volver a empezar</button>
            </div>
        </section>

        <section id="error-screen" class="screen">
            <div class="error-content">
                <h2>Error</h2>
                <p id="error-message"></p>
                <button id="retry-button" class="btn btn-primary">Reintentar</button>
            </div>
        </section>
    </main>

    <script src="src/js/questions-data.js"></script>
    <script src="src/js/question-repository.js"></script>
    <script src="src/js/session-manager.js"></script>
    <script src="src/js/result-processor.js"></script>
    <script src="src/js/quiz-engine.js"></script>
    <script src="src/js/ui.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
